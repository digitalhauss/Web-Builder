<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Atelier V8 — Studio Workspace</title>
<style>
:root{--bg:#e9ebef;--panel:#fff;--ink:#1c2027;--mut:#6b7380;--line:#e2e5ea;--acc:#3a5bf0;--acc2:#eef1ff;--ok:#18864b;--bad:#c93a3a;--r:10px;--sh:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.08);--iz:1}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#top{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:20;overflow-x:auto}
#top .sp{flex:1;min-width:8px}
.brand{font-weight:700;letter-spacing:-.02em;font-size:15px;padding:0 6px;white-space:nowrap}
.pname{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600;width:170px;min-width:90px}
.pname:hover,.pname:focus{border-color:var(--line);background:#fafbfc;outline:none}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#f4f5f8}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.pri:hover{background:#2c49d4}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.on{background:var(--acc2);border-color:#c9d3ff;color:var(--acc)}
.btn.dng{color:var(--bad)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 10px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc2);color:var(--acc);font-weight:600}
.saved{color:var(--mut);font-size:12px;white-space:nowrap;min-width:70px}
#main{flex:1;display:flex;min-height:0;position:relative}
#rail{width:64px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column;gap:2px}
#rail button{border:0;background:transparent;border-radius:8px;padding:7px 2px;font-size:10.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
#rail button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#rail button.on{background:var(--acc2);color:var(--acc);font-weight:600}
#rail button:hover:not(.on){background:#f4f5f8}
#left{width:276px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
#right{width:286px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:0 0 40px}
#left h3,#right h3{margin:0 0 10px;font-size:13px}
#stage{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#viewport{flex:1;overflow:auto;padding:44px 56px 160px;background:var(--bg)}
#zoomwrap{margin:0 auto;position:relative}
#frame{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:var(--sh)}
#statusbar{height:34px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
#statusbar input[type=range]{width:120px}
.hint{color:var(--mut);font-size:12px}
.grp{border-bottom:1px solid var(--line);padding:10px 14px}
.grp>summary{font-weight:600;cursor:pointer;padding:2px 0 8px;list-style:none;display:flex;justify-content:space-between}
.grp>summary::after{content:"▾";color:var(--mut)}
.grp:not([open])>summary::after{content:"▸"}
.grp:not([open]){padding-bottom:6px}
.grp:not([open])>summary{padding-bottom:0}
.rhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;position:sticky;top:0;background:#fff;z-index:5}
.rhead b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bpnote{margin:10px 14px 0;padding:7px 9px;border-radius:8px;font-size:12px;background:#fff7e6;border:1px solid #f6dfa8;color:#7a5a05}
.bpnote.all{background:#eef9f2;border-color:#bfe5cd;color:#176b3d}
.f{display:flex;align-items:center;gap:8px;margin:6px 0}
.f>span{width:84px;flex:none;color:var(--mut);font-size:12px}
.f>input[type=number],.f>input[type=text],.f>select,.f>textarea,.f>input[type=url]{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 7px;background:#fff}
.f>textarea{min-height:70px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.f>input[type=range]{flex:1;min-width:0}
.f>output{width:34px;text-align:right;font-size:12px;color:var(--mut)}
.f>input[type=checkbox]{margin-right:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f2 .f>span{width:auto;min-width:16px}
.sw{width:30px;height:24px;border-radius:6px;border:1px solid rgba(0,0,0,.18);cursor:pointer;flex:none;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:8px 8px;background-position:0 0,4px 4px;position:relative;overflow:hidden}
.sw i{position:absolute;inset:0}
.cf{display:flex;align-items:center;gap:8px;flex:1}
.cf code{font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:grab;user-select:none;text-align:center}
.tile:hover{border-color:#b6c3ff;background:var(--acc2)}
.tile svg{width:26px;height:26px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile .pv{width:34px;height:34px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:2px 9px;font-size:12px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin-bottom:6px}
.lbl{margin:14px 0 6px;font-weight:600;font-size:12px}
.lbl:first-child{margin-top:0}
.fontrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:19px;line-height:1.2}
.fontrow:hover{border-color:#b6c3ff;background:var(--acc2)}
.fontrow.on{border-color:var(--acc);background:var(--acc2)}
.fontrow small{font:11px system-ui;color:var(--mut)}
.assets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.asset{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fafafa;position:relative}
.asset .im{height:84px;background-color:#fff;background-image:linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%),linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%);background-size:12px 12px;background-position:0 0,6px 6px;cursor:grab;position:relative}
.asset .im img{width:100%;height:100%;object-fit:contain;display:block}
.asset .ac{display:flex;gap:2px;padding:3px;flex-wrap:wrap}
.asset .ac button{border:0;background:transparent;font-size:11px;padding:2px 4px;border-radius:5px;color:var(--mut)}
.asset .ac button:hover{background:#eee;color:var(--ink)}
.empty{border:1.5px dashed #cfd5de;border-radius:10px;padding:18px 12px;text-align:center;color:var(--mut)}
.layer{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:7px;border:1px solid transparent;font-size:12.5px}
.layer:hover{background:#f4f5f8}
.layer.on{background:var(--acc2);border-color:#c9d3ff}
.layer.sec{font-weight:600;margin-top:6px;background:#f6f7f9}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.layer .nm input{width:100%}
.layer button{border:0;background:transparent;padding:2px 4px;border-radius:5px;color:var(--mut);font-size:12px}
.layer button:hover{background:#e6e9ef;color:var(--ink)}
.layer button.on{color:var(--acc)}
.layer.drop{box-shadow:0 -2px 0 var(--acc)}
.tcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.tcard .tp{height:110px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.tcard .tb{padding:8px 10px;display:flex;align-items:center;gap:6px}
.tcard .tb b{flex:1}
.pagerow{display:flex;align-items:center;gap:6px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.pagerow.on{border-color:var(--acc);background:var(--acc2)}
.pagerow span{flex:1;cursor:pointer}
.palrow{display:flex;gap:4px;flex-wrap:wrap}
.palrow .sw{width:22px;height:22px}
.navitem{border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#fff}
.navitem.on{border-color:var(--acc)}
.navitem .nh{display:flex;align-items:center;gap:4px;padding:5px 6px}
.navitem .nh span{flex:1;cursor:pointer;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .nb{padding:2px 10px 8px;border-top:1px solid var(--line)}
.ib{border:0;background:transparent;border-radius:6px;padding:2px 6px;color:var(--mut)}
.ib:hover{background:#eceff3;color:var(--ink)}
/* popovers & modals */
#pop{position:fixed;z-index:200;display:none;width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,40,.22);padding:12px}
#pop.show{display:block}
#pop .big{width:100%;height:120px;border:0;padding:0;background:none;cursor:pointer}
#modal{position:fixed;inset:0;z-index:150;background:rgba(20,25,40,.45);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(780px,100%);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mbox.lg{width:min(1100px,100%)}
.mhead{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead b{flex:1;font-size:15px}
.mbody{padding:16px 18px;overflow:auto}
.mfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .pane{border:1px solid var(--line);border-radius:10px;min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:#fff;background-image:linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%),linear-gradient(45deg,#e9e9e9 25%,transparent 25%,transparent 75%,#e9e9e9 75%);background-size:14px 14px;background-position:0 0,7px 7px}
.cmp img{max-width:100%;max-height:300px}
.spin{width:26px;height:26px;border:3px solid #dde2ff;border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fdeeee;border:1px solid #f3c2c2;color:#8d2323;border-radius:8px;padding:8px 10px;margin:8px 0}
.okmsg{background:#eef9f2;border:1px solid #bfe5cd;color:#176b3d;border-radius:8px;padding:8px 10px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:#1c2027;color:#fff;padding:8px 14px;border-radius:10px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.prow{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px}
.prow b{flex:1}
.prow.on{border-color:var(--acc);background:var(--acc2)}
.gradbar{height:22px;border-radius:6px;border:1px solid var(--line);margin:4px 0 6px}
.helpbox pre{background:#f4f5f8;padding:10px;border-radius:8px;overflow:auto;font-size:12px}
.helpbox h4{margin:14px 0 4px}
/* ===== canvas editing chrome ===== */
#frame.edit .el{cursor:move}
#frame.edit .el:hover{outline:1px solid rgba(58,91,240,.55)}
#frame.edit .el.lock{cursor:default}
#frame.edit .el.selected{outline:calc(2px*var(--iz)) solid var(--acc)}
#frame.edit .sec{outline:1px dashed transparent}
#frame.edit .sec:hover{outline-color:rgba(58,91,240,.35)}
#frame.edit .sec.selected{outline:calc(2px*var(--iz)) solid #8aa0ff}
.sechead{position:absolute;top:0;left:0;z-index:60;display:none;gap:2px;background:var(--acc);color:#fff;border-radius:0 0 8px 0;padding:2px 4px;font-size:calc(12px*var(--iz));align-items:center;font-family:system-ui}
.sec:hover>.sechead,.sec.selected>.sechead{display:flex}
.sechead b{padding:0 6px;font-weight:600;cursor:pointer}
.sechead button{border:0;background:transparent;color:#fff;border-radius:5px;padding:1px 5px;font-size:inherit}
.sechead button:hover{background:rgba(255,255,255,.25)}
.addsec{display:none}
.h{position:absolute;width:calc(10px*var(--iz));height:calc(10px*var(--iz));background:#fff;border:calc(1.5px*var(--iz)) solid var(--acc);border-radius:2px;z-index:80;touch-action:none}
.h.nw{left:calc(-5px*var(--iz));top:calc(-5px*var(--iz));cursor:nwse-resize}.h.n{left:50%;top:calc(-5px*var(--iz));margin-left:calc(-5px*var(--iz));cursor:ns-resize}.h.ne{right:calc(-5px*var(--iz));top:calc(-5px*var(--iz));cursor:nesw-resize}
.h.e{right:calc(-5px*var(--iz));top:50%;margin-top:calc(-5px*var(--iz));cursor:ew-resize}.h.se{right:calc(-5px*var(--iz));bottom:calc(-5px*var(--iz));cursor:nwse-resize}.h.s{left:50%;bottom:calc(-5px*var(--iz));margin-left:calc(-5px*var(--iz));cursor:ns-resize}
.h.sw{left:calc(-5px*var(--iz));bottom:calc(-5px*var(--iz));cursor:nesw-resize}.h.w{left:calc(-5px*var(--iz));top:50%;margin-top:calc(-5px*var(--iz));cursor:ew-resize}
.h.rot{left:50%;top:calc(-28px*var(--iz));margin-left:calc(-6px*var(--iz));width:calc(12px*var(--iz));height:calc(12px*var(--iz));border-radius:50%;cursor:grab}
.tools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--sh);z-index:12}
.tools button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:12.5px;color:var(--ink)}
.tools button.on{background:var(--acc);color:#fff}
.tools button:hover:not(.on){background:#f1f3f7}
.tools i{width:1px;background:var(--line);margin:3px 4px}
.anc{position:absolute;width:calc(9px*var(--iz));height:calc(9px*var(--iz));margin:calc(-4.5px*var(--iz)) 0 0 calc(-4.5px*var(--iz));background:#fff;border:calc(1.5px*var(--iz)) solid var(--acc);border-radius:2px;z-index:90;cursor:move;touch-action:none}
.anc.hnd{border-radius:50%;background:var(--acc)}
.ovbadge{position:absolute;top:0;right:0;z-index:60;background:#7c3aed;color:#fff;font:600 calc(11px*var(--iz)) system-ui;padding:2px 8px;border-radius:0 0 0 8px}
.marq{position:fixed;border:1px solid var(--acc);background:rgba(58,91,240,.12);z-index:60;pointer-events:none}
#frame.proto .el.has-ix{outline:calc(1.5px*var(--iz)) dashed #7c3aed}
#frame.pen,#frame.pen *{cursor:crosshair!important}
.ixcard{margin:10px 14px;border:1px solid var(--line);border-radius:10px;padding:4px 10px 8px;background:#fbfaff}
.guide{position:absolute;background:#ff3d7f;z-index:90;pointer-events:none}
.gridov{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(rgba(58,91,240,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(58,91,240,.12) 1px,transparent 1px);background-size:20px 20px}
.dropmark{outline:3px solid var(--acc) !important}
.nvsel{outline:calc(2px*var(--iz)) solid var(--acc);outline-offset:calc(-2px*var(--iz))}
.nv-i.pick{outline:calc(2px*var(--iz)) solid var(--acc)}
.ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#f0f2f6;color:#8a93a3;font:13px system-ui;text-align:center;padding:8px}
/* touch: dragging elements/handles must not scroll the page */
#frame .el,#frame .h,#frame .pathpt,#frame .sechead,#frame .sh{touch-action:none}
#viewport{-webkit-overflow-scrolling:touch}
button,[data-a]{touch-action:manipulation}
#viewport{touch-action:pan-x pan-y}
.el,.h,.pathpt,.pa{touch-action:none}
@media (pointer:coarse){
 .h::after,.pathpt::after,.pa::after{content:"";position:absolute;inset:calc(-12px*var(--iz))}
 #top .btn,#tools button,#rail button{min-height:40px}
}
@media(max-width:760px){
 #main{flex-direction:column}
 #stage{order:1}
 #rail{order:3;width:auto;height:calc(62px + env(safe-area-inset-bottom));flex:none;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom))}
 #rail button{flex:none;min-width:66px}
 #left,#right{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));top:auto;width:auto;height:46vh;border:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 34px rgba(20,25,40,.22);z-index:40;padding-top:8px}
 #right{padding-bottom:30px}
 #viewport{padding:12px}
 .sheetx{display:flex}
 .rhead{padding-right:48px}
 .hide-m{display:none}
 #statusbar{overflow-x:auto}
 .btn,.seg button,#tools button{min-height:36px}
 .f>input[type=number],.f>input[type=text],.f>select{min-height:34px;font-size:16px}
}
.sheetx{display:none;position:sticky;top:4px;float:right;z-index:12;width:34px;height:34px;align-items:center;justify-content:center;border:0;border-radius:50%;background:#eceff4;margin:0 4px 0 0;font-size:14px;color:var(--ink)}
body.focus #tools{display:none}
/* ===== v2 editor additions ===== */
#tools{display:none!important}
#dock{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:2px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
#dock button{flex:none;width:40px;height:40px;border:0;background:transparent;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative}
#dock button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#dock button:hover:not(:disabled){background:#f1f3f7}
#dock button.on{background:var(--acc2);color:var(--acc)}
#dock button:disabled{opacity:.3;cursor:default}
#dock button.dng:not(:disabled){color:var(--bad)}
#dock i{width:1px;height:24px;background:var(--line);margin:0 3px;flex:none}
#dock .dlab{padding:0 8px;color:var(--mut);font-size:12px;white-space:nowrap}
#dock button .bd{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--acc);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 3px}
#viewport{padding-top:64px!important}
@media(max-width:760px){#dock{top:6px}#dock button{width:42px;height:42px}#viewport{padding-top:60px!important}}
/* edge handles that fold the side panels */
.edge{position:absolute;top:calc(50% - 30px);z-index:31;width:20px;height:60px;border:1px solid var(--line);background:#fff;color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:15px;padding:0;box-shadow:var(--sh)}
.edge:hover{color:var(--acc);background:var(--acc2)}
#edgeL{left:0;border-left:0;border-radius:0 10px 10px 0}
#edgeR{right:0;border-right:0;border-radius:10px 0 0 10px}
@media(max-width:760px){.edge{display:none}}
body.focus .edge{display:none}
@media(max-width:1000px) and (min-width:761px){#left{width:228px}#right{width:244px}#rail{width:58px}}
#left,#right{transition:none}
/* top bar menu */
#tmenu{position:fixed;z-index:300;min-width:190px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(20,25,40,.22);padding:6px;display:none}
#tmenu.show{display:block}
#tmenu button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left}

const store={
 async get(k){if(S.server){try{const r=await fetch(kvUrl(k));if(r.status===404)return null;if(r.ok)return(await r.json()).value}catch(e){}return null}
  try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null}}catch(e){}
  if(idb.db){try{const v=await idb.get(k);return v===undefined?null:v}catch(e){}}
  return mem[k]??null},
 async set(k,v){if(S.server){try{const r=await fetch(kvUrl(k),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});return r.ok}catch(e){return false}}
  mem[k]=v;
  try{if(window.storage){await window.storage.set(k,v);return true}}catch(e){return false}
  if(idb.db){try{await idb.set(k,v);return true}catch(e){return false}}
  return false},

  delete mem[k];try{if(window.storage)await window.storage.delete(k)}catch(e){}

 if(!S.pid)return; const payload=JSON.stringify({doc:S.doc,assets:S.assets,videos:S.videos||[],fonts:S.fonts,music:S.music});

  case'arrow':p=`<path d="M2 50H96M68 22L96 50L68 78" fill="none" stroke="${col(el.fill.c)}" stroke-width="${Math.max(sw,3)}" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/>`;break;

 }

let PK=null;
function openPicker(btn){
 const tag=btn.dataset.o,p=btn.dataset.p;PK={tag,p,btn,raw:gv(tag,p)};
 const pop=$('#pop');pop.classList.add('show');drawPicker();
 const r=btn.getBoundingClientRect(),pw=260,ph=pop.offsetHeight;
 pop.style.left=clamp(r.left-pw-10,8,innerWidth-pw-8)+'px';pop.style.top=clamp(r.top-20,8,innerHeight-ph-8)+'px' }
function closePicker(){ if(PK&&PK.last){const c=toHex(parseColor(PK.last));S.recent=[c,...S.recent.filter(x=>x!==c)].slice(0,12)} $('#pop').classList.remove('show');PK=null }
function drawPicker(){

 const sw=(val,t='')=>`<div class="sw" data-pk="set" data-v="${esc(val)}" title="${esc(t||val)}"><i style="background:${val.startsWith('tok:')?col(val):val}"></i></div>`;

const slugOk=(tag,path)=>tag==='page'&&path==='slug';
function setField(tag,path,val){
 const o=T(tag);if(!o)return;
 commit(tag+':'+path+':'+(o.id||''));
 if(path.startsWith('g.')){const k=path.slice(2);
  if(tag==='el')setGeom(o,S.bp,{[k]:val});
  else if(tag==='sec'){if(S.bp==='d')o.h=val;else(o.hb||(o.hb={}))[S.bp]=val}}
 else{
  if(tag==='el'&&path==='guestDynamic'){
   if(val&&!o.guestTemplate)o.guestTemplate=guestPattern(o);
   if(!val&&o.guestDynamic)o.text=guestFormat(guestPattern(o),o.guestFallback||'Tamu Undangan');
  }
  if(slugOk(tag,path))val=slugify(val);setP(o,path,val)
 }
 if(tag==='el'&&path==='shape'&&val==='square')setGeom(o,'d',{h:o.w});
 if(tag==='el'&&path==='shape'&&SHAPE_DIM[val]&&(val==='line'||val==='arrow'||val==='wave')){o.h=SHAPE_DIM[val][1]}
 if(tag==='nav'&&path==='pos'&&val==='custom'&&!o.custom.sec)o.custom.sec=(curPage().sections[0]||{}).id;
 renderCanvas();
 if(path==='name'||path==='text'&&S.tab==='layers')renderLeft() }

 if(ty==='b')v=t.checked;else if(ty==='s'){v=t.value;const cur=gv(t.dataset.o,t.dataset.p);if(typeof cur==='number'&&v!==''&&!isNaN(+v))v=+v}

function pkInput(t){
 if(!PK)return;const k=t.dataset.pk,c=parseColor(PK.raw);
 if(k==='native')pkApply(toCss({...parseColor(t.value),a:c.a}));
 else if(k==='hex'){let h=t.value.trim();if(/^#?[0-9a-f]{6}$/i.test(h)){h=h.startsWith('#')?h:'#'+h;pkApply(toCss({...parseColor(h),a:c.a}))}}
 else if(k==='a')pkApply(toCss({...c,a:+t.value}));
 else if(['r','g','b'].includes(k)){c[k]=clamp(+t.value||0,0,255);pkApply(toCss(c))} }
function pkCommit(){if(PK&&PK.last){const c=toHex(parseColor(PK.last));S.recent=[c,...S.recent.filter(x=>x!==c)].slice(0,12)}}
document.addEventListener('click',e=>{

  if(k==='set')pkApply(pk.dataset.v,true);
  if(k==='save'){const h=toHex(parseColor(PK.raw));commit(discrete());(S.doc.saved=S.doc.saved||[]);if(!S.doc.saved.includes(h))S.doc.saved.push(h);drawPicker();toast('Color saved');}
  if(k==='clear')pkApply('',true);
  if(k==='done')closePicker();
  return}

 if(cf){e.stopPropagation();if(PK&&PK.btn===cf){closePicker();return}if(PK)closePicker();openPicker(cf);return}

function nodeOf(id){return $(`#frame .el[data-id="${id}"]`)}
function applyGeomNode(n,el){const b=S.bp,W=BP[b];n.style.left=(effG(el,b,'x')/W*100)+'%';n.style.top=effG(el,b,'y')+'px';n.style.width=(effG(el,b,'w')/W*100)+'%';n.style.height=effG(el,b,'h')+'px';n.style.transform=`rotate(${el.rot}deg)`}
function clearGuides(){$$('#frame .guide').forEach(g=>g.remove())}
function drawGuides(inn,gs){clearGuides();for(const g of gs){const d=document.createElement('div');d.className='guide';if(g.v==='x')d.style.cssText=`left:${g.p}px;top:0;width:calc(1px*var(--iz));height:100%`;else d.style.cssText=`top:${g.p}px;left:0;height:calc(1px*var(--iz));width:100%`;inn.appendChild(d)}}
function snapPos(el,sec,nx,ny,w,h,alt){
 const b=S.bp,W=BP[b],H=secH(sec,b),thr=6/S.zoom,gs=[];
 if(alt)return{x:nx,y:ny,gs};
 const xs=[0,W/2,W,...(S.gcfg.snap?guideXs():[])],ys=[0,H/2,H,...(S.gcfg.snap?guideYs(sec):[])];
 for(const o of sec.elements){if(o===el||o.hidden)continue;const ox=effG(o,b,'x'),oy=effG(o,b,'y'),ow=effG(o,b,'w'),oh=effG(o,b,'h');xs.push(ox,ox+ow/2,ox+ow);ys.push(oy,oy+oh/2,oy+oh)}
 let bx=null,by=null;
 for(const m of[0,w/2,w])for(const c of xs){const d=c-(nx+m);if(Math.abs(d)<thr&&(bx===null||Math.abs(d)<Math.abs(bx.d)))bx={d,c}}
 for(const m of[0,h/2,h])for(const c of ys){const d=c-(ny+m);if(Math.abs(d)<thr&&(by===null||Math.abs(d)<Math.abs(by.d)))by={d,c}}
 if(bx){nx+=bx.d;gs.push({v:'x',p:bx.c})}else if(S.grid&&S.gcfg.snap)nx=Math.round(nx/gridStep())*gridStep();
 if(by){ny+=by.d;gs.push({v:'y',p:by.c})}else if(S.grid&&S.gcfg.snap)ny=Math.round(ny/gridStep())*gridStep();
 return{x:Math.round(nx),y:Math.round(ny),gs} }
function startMove(e,id){
 const f=findEl(id);if(!f||f.el.locked)return;const el=f.el,b=S.bp,secId=f.sec.id;
 const st={x:effG(el,b,'x'),y:effG(el,b,'y'),w:effG(el,b,'w'),h:effG(el,b,'h')},sx=e.clientX,sy=e.clientY;let moved=false;
 const node=nodeOf(id),inn=node.parentElement;
 const mv=ev=>{let dx=(ev.clientX-sx)/S.zoom,dy=(ev.clientY-sy)/S.zoom;
  if(!moved){if(Math.hypot(dx,dy)<3)return;moved=true;commit(discrete())}
  if(ev.shiftKey){if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0}
  const sn=snapPos(el,f.sec,st.x+dx,st.y+dy,st.w,st.h,ev.altKey);
  setGeom(el,b,{x:sn.x,y:sn.y});applyGeomNode(node,el);drawGuides(inn,sn.gs)};
 const up=ev=>{window.removeEventListener('pointermove',mv);clearGuides();
  if(!moved){return}
  const under=document.elementsFromPoint(ev.clientX,ev.clientY).map(n=>n.closest&&n.closest('.sec')).find(Boolean);
  if(under&&under.dataset.sec!==secId){const to=secInfo(under.dataset.sec);
   if(to){const r=node.getBoundingClientRect(),ir=under.querySelector('.in').getBoundingClientRect();
    f.sec.elements.splice(f.sec.elements.indexOf(el),1);to.sec.elements.push(el);
    setGeom(el,b,{x:Math.round((r.left-ir.left)/S.zoom),y:Math.round((r.top-ir.top)/S.zoom)});toast('Moved to '+to.sec.name)}}
  renderCanvas();renderRight();if(S.tab==='layers')renderLeft()};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up,{once:true}) }
function startResize(e,id,dir){
 const f=findEl(id);if(!f||f.el.locked)return;e.preventDefault();const el=f.el,b=S.bp;
 const st={x:effG(el,b,'x'),y:effG(el,b,'y'),w:effG(el,b,'w'),h:effG(el,b,'h')},sx=e.clientX,sy=e.clientY,rad=el.rot*Math.PI/180,node=nodeOf(id);let did=false;
 const mv=ev=>{if(!did){did=true;commit(discrete())}
  const dx=(ev.clientX-sx)/S.zoom,dy=(ev.clientY-sy)/S.zoom,ldx=dx*Math.cos(rad)+dy*Math.sin(rad),ldy=-dx*Math.sin(rad)+dy*Math.cos(rad);
  let w=st.w,h=st.h,x=st.x,y=st.y;
  if(dir.includes('e'))w=st.w+ldx;if(dir.includes('w'))w=st.w-ldx;if(dir.includes('s'))h=st.h+ldy;if(dir.includes('n'))h=st.h-ldy;
  if(ev.shiftKey&&dir.length===2){const r=st.w/st.h;if(Math.abs(w/st.w)>Math.abs(h/st.h))h=w/r;else w=h*r}
  if(S.grid&&!ev.altKey){w=Math.round(w/10)*10;h=Math.round(h/10)*10}
  w=Math.max(8,w);h=Math.max(4,h);
  if(dir.includes('w'))x=st.x+(st.w-w);if(dir.includes('n'))y=st.y+(st.h-h);
  setGeom(el,b,{x:Math.round(x),y:Math.round(y),w:Math.round(w),h:Math.round(h)});applyGeomNode(node,el)};
 const up=()=>{window.removeEventListener('pointermove',mv);if(did){renderCanvas();renderRight()}};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up,{once:true}) }
function startRotate(e,id){
 const f=findEl(id);if(!f||f.el.locked)return;e.preventDefault();const el=f.el,node=nodeOf(id);let did=false;
 const mv=ev=>{if(!did){did=true;commit(discrete())}const r=node.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let a=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;if(ev.shiftKey)a=Math.round(a/15)*15;a=Math.round(a);if(a>180)a-=360;el.rot=a;node.style.transform=`rotate(${a}deg)`};
 const up=()=>{window.removeEventListener('pointermove',mv);if(did){renderCanvas();renderRight()}};
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up,{once:true}) }

function makeFromSpec(sp){
 let el;
 if(sp.asset){const a=asset(sp.asset);if(!a)return null;const w=Math.min(360,a.w),h=Math.round(w*a.h/a.w);el=newEl('image',{w,h,asset:a.id,alt:a.name.replace(/\.\w+$/,''),name:a.name.slice(0,24)})}
 else if(sp.type==='shape'){const d=SHAPE_DIM[sp.shape]||[200,200];el=newEl('shape',{shape:sp.shape,w:d[0],h:d[1],name:cap(sp.shape)});if(sp.shape==='line'||sp.shape==='arrow'||sp.shape==='wave'){el.sw=4;el.fill.c='tok:ink'}}
 else if(sp.preset!==undefined){const p=TEXT_PRESETS[sp.preset];el=newEl(p[0],{text:p[3],st:p[2],name:p[1]});if(p[2].fs>40)el.h=Math.round(p[2].fs*1.4);else if(p[2].fs>20)el.h=Math.round(p[2].fs*1.6)}
 else el=newEl(sp.type);
 return el }
function addEl(el,secId,cx,cy){

 el.x=Math.round(cx/r-el.w/2);el.y=Math.round(cy/r-el.h/2);
 si.sec.elements.push(el);S.sel={k:'el',id:el.id};if(si.page.id!==S.pageId)S.pageId=si.page.id;if(innerWidth<760)S.leftOpen=false;S.rightClosed=false;
 renderCanvas();renderRight();if(['layers'].includes(S.tab))renderLeft();layoutPanels() }

function readImage(file){return new Promise((res,rej)=>{
 const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read '+file.name));
 fr.onload=()=>{const url=fr.result,im=new Image();im.onerror=()=>rej(new Error(file.name+' is not a valid image'));

/* ---------- background removal (remove.bg-compatible API) ---------- */
let RM=null;
function openRmbg(aid){const a=asset(aid);if(!a){toast('Choose an image first');return}RM={aid,res:null,busy:false,err:''};drawRm()}
function drawRm(){
 const a=asset(RM.aid),noKey=!S.cfg.removebgKey&&!S.cfg.rmbgUrl&&!S.serverRm;
 showModal(mbox('Remove background',`${noKey?`<div class="err">No API key configured. Open <b>Settings</b> and add a remove.bg API key (or your own proxy URL) to enable this. <button class="btn sm" data-a="settings">Open settings</button></div>`:''}
 ${RM.err?`<div class="err">${esc(RM.err)}</div>`:''}
 <div class="cmp"><div><div class="hint" style="margin-bottom:4px">Original</div><div class="pane"><img src="${a.data}" alt="Original"></div></div><div><div class="hint" style="margin-bottom:4px">Result (transparent PNG)</div><div class="pane">${RM.busy?'<div class="spin" role="status" aria-label="Processing"></div>':RM.res?`<img src="${RM.res}" alt="Result">`:'<span class="hint">Run Remove background to see the result</span>'}</div></div></div>`,
 `<button class="btn" data-a="mclose">Cancel</button>${RM.res?`<button class="btn" data-a="rm-dl">Download PNG</button><button class="btn dng" data-a="rm-reject">Reject</button><button class="btn pri" data-a="rm-accept">Accept & use</button>`:`<button class="btn pri" data-a="rm-run" ${RM.busy?'disabled':''}>${RM.busy?'Processing…':'Remove background'}</button>`}`)) }
async function rmRun(){
 RM.busy=true;RM.err='';RM.res=null;drawRm();
 try{
  const key=S.cfg.removebgKey,url=S.cfg.rmbgUrl||(S.serverRm?'/api/remove-bg':'https://api.remove.bg/v1.0/removebg');
  if(!key&&!S.cfg.rmbgUrl&&!S.serverRm)throw new Error('Add a remove.bg API key in Settings first.');
  const a=asset(RM.aid),blob=await (await fetch(a.data)).blob(),fd=new FormData();
  fd.append('image_file',blob,a.name||'image.png');fd.append('size','auto');fd.append('format','png');
  const r=await fetch(url,{method:'POST',headers:key?{'X-Api-Key':key}:{},body:fd});
  if(!r.ok){let m='';try{const j=await r.json();m=(j.errors&&j.errors[0]&&j.errors[0].title)||''}catch(e){}
   throw new Error(r.status===403?'The API key was rejected (403). Check the key in Settings.':r.status===402?'No credits left on this API key (402).':r.status===429?'Rate limit reached (429). Try again in a minute.':`The service returned ${r.status}. ${m}`)}
  const out=await r.blob();
  if(!/image\//.test(out.type))throw new Error('The service did not return an image.');
  RM.res=await new Promise(rs=>{const fr=new FileReader();fr.onload=()=>rs(fr.result);fr.readAsDataURL(out)})
 }catch(err){RM.err=err instanceof TypeError?'Could not reach the service. The browser blocked the request (network or CORS). Use a proxy URL in Settings, or check your connection.':err.message}
 RM.busy=false;if(RM)drawRm() }

document.addEventListener('keydown',e=>{
 const tg=e.target;if(/INPUT|TEXTAREA|SELECT/.test(tg.tagName)||tg.isContentEditable){if(e.key==='Escape'&&PK)closePicker();return}
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(typeof figmaKeys==='function'&&figmaKeys(e,mod,k))return;
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
 if(mod&&k==='y'){e.preventDefault();doRedo();return}
 if(mod&&k==='d'&&S.sel&&S.sel.k==='el'){e.preventDefault();dupEl(S.sel.id);return}
 if(mod&&k==='s'){e.preventDefault();saveNow().then(()=>toast('Saved'));return}
 if(e.key==='Escape'){if($('#modal').classList.contains('show'))closeModal();else if(PK)closePicker();else select(null);return}
 if(S.sel&&S.sel.k==='el'){
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delEl(S.sel.id);return}
  const d=e.shiftKey?10:1,m={ArrowLeft:[-d,0],ArrowRight:[d,0],ArrowUp:[0,-d],ArrowDown:[0,d]}[e.key];
  if(m){e.preventDefault();const f=findEl(S.sel.id);if(f&&!f.el.locked){commit('nudge'+S.sel.id);setGeom(f.el,S.bp,{x:effG(f.el,S.bp,'x')+m[0],y:effG(f.el,S.bp,'y')+m[1]});renderCanvas();renderRight()}}}});

async function doPublish(){
 const slug=slugify($('#pubslug').value||S.doc.name);const html=siteHTML(S.doc);
 let url=(S.doc.pub&&S.doc.pub.url)||'';
 if(pubEndpoint()){
  try{const r=await fetch(pubEndpoint(),{method:'POST',headers:{'Content-Type':'application/json',...(S.cfg.pubToken?{Authorization:'Bearer '+S.cfg.pubToken}:{})},body:JSON.stringify({slug,name:S.doc.name,html})});
   if(!r.ok)throw new Error('Endpoint returned '+r.status);let j={};try{j=await r.json()}catch(e){}url=j.url||url}
  catch(err){toast('Publish failed: '+(err instanceof TypeError?'could not reach the endpoint (network or CORS)':err.message),4500);return}}
 commit(discrete());S.doc.pub={slug,at:Date.now(),url};await saveVersion('Published '+slug);
 if(!pubEndpoint())downloadSite();
 openPublish();toast(pubEndpoint()?'Published':'Snapshot saved and HTML downloaded') }
async function doUnpublish(){
 const p=S.doc.pub;if(!p)return;
 if(pubEndpoint()){try{const r=await fetch(pubEndpoint().replace(/\/$/,'')+'/'+encodeURIComponent(p.slug),{method:'DELETE',headers:S.cfg.pubToken?{Authorization:'Bearer '+S.cfg.pubToken}:{}});if(!r.ok)throw new Error('Endpoint returned '+r.status)}catch(err){toast('Unpublish failed: '+err.message,4500);return}}
 commit(discrete());S.doc.pub=null;openPublish();toast('Unpublished') }

function driveId(u){u=String(u||'');const m=/drive\.google\.com\/(?:file\/d\/|open\?(?:[^#]*&)?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{15,})/.exec(u)||/docs\.google\.com\/(?:document|presentation|spreadsheets)\/d\/([\w-]{15,})/.exec(u);return m?m[1]:null}
function isDrive(u){return /(?:drive|docs)\.google\.com/.test(String(u||''))&&!!driveId(u)}
function driveFix(u,kind){if(!isDrive(u))return u;const id=driveId(u);
 if(kind==='image')return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
 if(kind==='poster')return `https://drive.google.com/thumbnail?id=${id}&sz=w1600`;

/* =====================================================================
   DESKTOP MASTER RESPONSIVE SYNC — Desktop is the canonical layout.
   Mobile inherits each untouched geometry property proportionally.
   Editors can freeze Mobile or push specific Mobile corrections outward.
   This data is saved inside the project and travels with exported HTML.
   ===================================================================== */
const RS_KEYS=['x','y','w','h','fs'];
function rsCfg(){
 if(!S.doc)return {mobileSync:true};
 return S.doc.responsive||(S.doc.responsive={mobileSync:true});
}
function rsForPage(fn){
 for(const p of S.doc.pages)for(const sec of p.sections){
  fn(null,sec,p);

 }
}
function rsClearMobile(){
 rsForPage((el,sec)=>{if(el){if(el.bp)delete el.bp.m;}else{
  if(sec.hb)delete sec.hb.m;
  sec.manualM=false;
 }});
}
function rsFreezeMobile(){
 // Evaluate the inherited / already-tuned layout before disabling sync.
 rsForPage((el,sec)=>{if(el){
  const current={};for(const k of RS_KEYS)current[k]=effG(el,'m',k);
  el.bp=el.bp||{};el.bp.m=current;
 }else{
  sec.hb=sec.hb||{};sec.hb.m=secH(sec,'m');
 }});
}
const rsRound=(v,k)=>k==='fs'?Math.max(6,Math.round(v*10)/10):Math.round(v);
function rsScope(){
 if(S.sel?.k==='el')return {type:'el',id:S.sel.id,label:'elemen terpilih'};
 if(S.sel?.k==='sec')return {type:'sec',id:S.sel.id,label:'section terpilih'};
 return {type:'page',id:S.pageId,label:'halaman aktif'};
}
function rsApplyMobile(target){
 const scope=rsScope(),dest=target==='d'?'Desktop':'Tablet';
 const entries=[];
 for(const p of S.doc.pages){
  if(scope.type==='page'&&p.id!==scope.id)continue;
  for(const sec of p.sections){
   if(scope.type==='sec'&&sec.id!==scope.id)continue;
   if(scope.type==='el'&&!sec.elements.some(e=>e.id===scope.id))continue;
   if(scope.type!=='el'&&sec.hb?.m!==undefined)entries.push({sec,p,kind:'section'});
   walkEls(sec.elements,e=>{if(scope.type==='el'&&e.id!==scope.id)return;
    if(e.bp?.m&&RS_KEYS.some(k=>e.bp.m[k]!==undefined))entries.push({el:e,p,sec,kind:'element'});
   });
  }
 }
 if(!entries.length){toast('Belum ada revisi Mobile pada '+scope.label);return}
 if(!confirm('Terapkan '+entries.length+' revisi geometri dari Mobile ke '+dest+' untuk '+scope.label+'?\n\nWarna, isi teks dan efek tetap tersinkron seperti sebelumnya.'))return;
 commit(discrete());let count=0;
 for(const entry of entries){
  if(entry.kind==='section'){
   const s=entry.sec,v=Math.round(s.hb.m*BP[target]/BP.m);
   if(target==='d')s.h=v;else(s.hb||(s.hb={})).t=v;
   if(target==='d'&&rsCfg().mobileSync)delete s.hb.m;
   count++;continue;
  }
  const el=entry.el,source=el.bp.m;
  for(const k of RS_KEYS){if(source[k]===undefined)continue;
   const ratio=BP[target]/BP.m;
   const value=rsRound(source[k]*ratio,k);
   if(target==='d'){
    if(k==='fs')el.st.fs=value;else el[k]=value;
    if(rsCfg().mobileSync)delete source[k];
   }else{el.bp.t=el.bp.t||{};el.bp.t[k]=value}
   count++;
  }
  if(target==='d'&&rsCfg().mobileSync&&!Object.keys(source).length)delete el.bp.m;
 }
 renderCanvas();renderRight();renderStatus();
 toast('Revisi Mobile diterapkan ke '+dest+' ('+count+' properti)');
}

let v6DriveScript=null;
function v6DriveGIS(){
 if(window.google?.accounts?.oauth2)return Promise.resolve();
 if(v6DriveScript)return v6DriveScript;
 v6DriveScript=new Promise((resolve,reject)=>{const j=document.createElement('script');j.src='https://accounts.google.com/gsi/client';j.async=true;j.onload=()=>window.google?.accounts?.oauth2?resolve():reject(new Error('Google Identity Services tidak tersedia'));j.onerror=()=>reject(new Error('Script login Google gagal dimuat; periksa koneksi'));document.head.appendChild(j)});

async function v6DriveAuth(){
 if(!v6DriveOrigin())throw new Error('Google OAuth perlu HTTPS atau localhost; bukan file://');
 const id=$('#v6-drive-client')?.value?.trim()||v6ClientGet();
 if(!/\.apps\.googleusercontent\.com$/.test(id))throw new Error('Isi OAuth Client ID Google terlebih dahulu');
 v6ClientSet(id);
 await v6DriveGIS();
 return new Promise((resolve,reject)=>{
  try{V6Drive.tokenClient=google.accounts.oauth2.initTokenClient({client_id:id,scope:V6DriveScope,callback:r=>{if(r.error){reject(new Error(r.error));return}V6Drive.token=r.access_token;resolve()}});V6Drive.tokenClient.requestAccessToken({prompt:'consent'})}
  catch(e){reject(e)}
 });
}
async function v6DriveFetch(endpoint,params){
 if(!V6Drive.token)throw new Error('Login Google Drive terlebih dahulu');
 const url=new URL('https://www.googleapis.com/drive/v3/'+endpoint);
 Object.entries(params||{}).forEach(([k,v])=>url.searchParams.set(k,v));
 const r=await fetch(url,{headers:{Authorization:'Bearer '+V6Drive.token}});
 if(!r.ok){let reason='';try{const j=await r.json();reason=j.error?.message||''}catch(_){}if(r.status===401)V6Drive.token=null;throw new Error(`Google Drive ${r.status}: ${reason||r.statusText}`)}
 return r;
}
async function v6DriveList(append=false){

 try{
  const q=`'${V6Drive.folder.replace(/'/g,"\\'")}' in parents and trashed = false`;
  const params={q,pageSize:'60',fields:'nextPageToken,files(id,name,mimeType,size,thumbnailLink,description)',orderBy:'name',supportsAllDrives:'true',includeItemsFromAllDrives:'true'};
  if(append&&V6Drive.next)params.pageToken=V6Drive.next;
  const data=await(await v6DriveFetch('files',params)).json();
  V6Drive.files=append?V6Drive.files.concat(data.files||[]):(data.files||[]);V6Drive.next=data.nextPageToken||'';
 }catch(e){toast(e.message,6500)}finally{V6Drive.busy=false;v6DriveShow()}
}
async function v6DriveImport(b){

 toast('Mengunduh '+f.name+' dari Google Drive…',3500);
 try{
  const r=await v6DriveFetch('files/'+encodeURIComponent(f.id),{alt:'media'});const blob=await r.blob();
  if(blob.size>max)throw new Error('File terlalu besar untuk editor');

  if(kind==='image'){const files=await processImages([file]);if(!files.length)throw new Error('Format gambar tidak dikenali')}
  else{
   const data=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('Gagal membaca file'));fr.readAsDataURL(blob)});

 }catch(e){toast(e.message,6000)}
}
